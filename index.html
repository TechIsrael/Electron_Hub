<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css" />
	<script type="text/javascript" src="app.js"></script>
</head>
<body>
 <header>
      <h2> Weather App </h2>
 </header>
<div class="weather-app">
    <div class="left">
	<div class="temperature"><spane id="temperature">Temp = </spane>&deg;</div>
	<div class="location"><spane id="location">Location = </spane></div>
	</div> 
	<div class="right">
	<div class="top">
	<!..<img id="icon" width="75px" src="imgs/codes/200.png" />..!>
	<img id="icon" width="75px" src="imgs/codes/200.png" />
	</div>
	<div class="bottom">
	<div class="humidity">
	<img src="imgs/humidity.png" height="16px" /> 
	<span id="humidity">0</span> %
	</div>
	<div class="wind">
	<span id="wind">Wind =</span> mph <span id="direction">N</span>
	</div>
    </div>
    </div>
</div>
</body>
</html>
